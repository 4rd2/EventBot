name: Update Career Events

on:
  schedule:
    - cron: '0 13 * * *'   # every day at 9am ET (1pm UTC)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r scrapers/requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper and post notifications
        run: python scrapers/run_all.py --merge
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Supabase + Twilio power phone notifications (PLAN.md §4.2).
          # Until these secrets are added, those steps skip cleanly.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}

      - name: Commit updated event data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.yaml data/sent_events.yaml
          git diff --staged --quiet || git commit -m "auto: update events $(date -u +%Y-%m-%d)"
          git push
